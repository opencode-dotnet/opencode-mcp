name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact publication target (dry-run publishes nothing)
        required: true
        type: choice
        options: [github-packages, nuget, github-release, dry-run]
      commit:
        description: Full candidate commit SHA
        required: true
        type: string
      native-run-id:
        description: Successful manual Native candidate run
        required: true
        type: string
      version:
        description: Exact committed candidate version
        required: true
        type: string
      files:
        description: Feed recovery only; comma-separated candidate package basenames (empty selects all seven)
        required: false
        type: string
      github-packages-verification-run-id:
        description: Successful GitHub Packages verification run (required for nuget)
        required: false
        type: string
      nuget-verification-run-id:
        description: Successful NuGet verification run (required for github-release)
        required: false
        type: string
      release-notes:
        description: Literal approved release notes (required for github-release)
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read # GitHub Packages absence check for github-packages and dry-run targets.
    outputs:
      feed: ${{ steps.inventory.outputs.feed }}
      assets: ${{ steps.inventory.outputs.assets }}
      selected: ${{ steps.absence.outputs.selected }}
      sdk-version: ${{ steps.record.outputs.sdk-version }}
    steps:
      - name: Require master dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if ($env:DISPATCH_REF -cne 'refs/heads/master') { throw 'Release dispatch must use refs/heads/master.' }
      - &checkout
        name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full candidate commit and master ancestry
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMMIT -cnotmatch '^[0-9a-f]{40}\z') { throw 'commit must be a full SHA.' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -cne $env:COMMIT) { throw 'Checkout does not equal the candidate commit.' }
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:COMMIT origin/master
          if ($LASTEXITCODE -ne 0) { throw 'master does not contain the candidate commit.' }
      - name: Verify Native run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NATIVE_RUN_ID: ${{ inputs.native-run-id }}
          COMMIT: ${{ inputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NATIVE_RUN_ID -notmatch '^[1-9][0-9]*\z') { throw 'native-run-id must be a run ID.' }
          $workflow = gh api "repos/$env:REPOSITORY/actions/workflows/native.yml" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $run = gh api "repos/$env:REPOSITORY/actions/runs/$env:NATIVE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.repository.full_name -cne $env:REPOSITORY -or $run.workflow_id -ne $workflow.id -or
              $run.name -cne 'Native' -or $run.event -cne 'workflow_dispatch' -or $run.status -cne 'completed' -or
              $run.conclusion -cne 'success' -or $run.head_branch -cne 'master' -or $run.head_sha -cne $env:COMMIT) {
            throw 'Native run does not identify a successful manual candidate from this repository on master.'
          }
      - &initialize
        name: Initialize owned SDK environment
        run: |
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
      - &sdk
        name: Setup candidate .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify committed version without an override
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = dotnet msbuild src/OpenCode.Mcp/OpenCode.Mcp.csproj -p:Configuration=Release -nodeReuse:false -p:UseSharedCompilation=false -getProperty:Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -isnot [string] -or $version -cne $env:VERSION) { throw 'version differs from the evaluated candidate version.' }
      - &tree
        name: Refetch master and verify workflow tree
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:COMMIT origin/master
          if ($LASTEXITCODE -ne 0) { throw 'master does not contain the candidate commit.' }
          $candidate = git rev-parse "$($env:COMMIT):.github/workflows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $master = git rev-parse 'origin/master:.github/workflows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($candidate -cne $master) { throw 'Candidate workflow tree differs from the current master tip.' }
      - name: Verify promotion run provenance
        id: promotion
        if: inputs.target == 'nuget' || inputs.target == 'github-release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
          GITHUB_VERIFICATION: ${{ inputs.github-packages-verification-run-id }}
          NUGET_VERIFICATION: ${{ inputs.nuget-verification-run-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $id = if ($env:TARGET -ceq 'nuget') { $env:GITHUB_VERIFICATION } else { $env:NUGET_VERIFICATION }
          if ($id -notmatch '^[1-9][0-9]*\z') { throw 'The preceding channel verification run ID is required.' }
          $workflow = gh api "repos/$env:REPOSITORY/actions/workflows/verify-channel.yml" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $run = gh api "repos/$env:REPOSITORY/actions/runs/$id" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.repository.full_name -cne $env:REPOSITORY -or $run.workflow_id -ne $workflow.id -or
              $run.event -cne 'workflow_dispatch' -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
              $run.head_branch -cne 'master' -or $run.run_attempt -lt 1) {
            throw 'Promotion evidence must be a successful manual verify-channel run for the candidate on master.'
          }
          "run-id=$id" >> $env:GITHUB_OUTPUT
          "attempt=$($run.run_attempt)" >> $env:GITHUB_OUTPUT
      - name: Download promotion evidence
        if: inputs.target == 'nuget' || inputs.target == 'github-release'
        uses: actions/download-artifact@v8
        with:
          name: channel-verification
          path: ${{ runner.temp }}/channel-verification
          run-id: ${{ steps.promotion.outputs.run-id }}
          github-token: ${{ github.token }}
      # channel-verification contains one JSON document. Identity fields are strings:
      # channel, version, commit, nativeRunId, verificationRunId; runAttempt is an integer.
      # runtimes is manifest-ordered: { rid, runner, tests: { total, passed, failed,
      # skipped }, results: [retained Actions artifact URLs] }. Totals are integers.
      - name: Validate promotion identity and all manifest results
        if: inputs.target == 'nuget' || inputs.target == 'github-release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          NATIVE_RUN_ID: ${{ inputs.native-run-id }}
          VERIFICATION_RUN_ID: ${{ steps.promotion.outputs.run-id }}
          VERIFICATION_ATTEMPT: ${{ steps.promotion.outputs.attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'channel-verification') -Force)
          if ($files.Count -ne 1 -or $files[0].PSIsContainer -or $files[0].Extension -cne '.json') { throw 'Expected one channel-verification JSON document.' }
          $proof = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          $channel = if ($env:TARGET -ceq 'nuget') { 'github-packages' } else { 'nuget' }
          if ($proof.channel -cne $channel -or $proof.version -cne $env:VERSION -or $proof.commit -cne $env:COMMIT -or
              $proof.nativeRunId -cne $env:NATIVE_RUN_ID -or $proof.verificationRunId -cne $env:VERIFICATION_RUN_ID -or
              $proof.runAttempt -ne [long]$env:VERIFICATION_ATTEMPT) { throw 'Promotion artifact candidate identity differs.' }
          $manifest = Get-Content packaging/native-manifest.json -Raw | ConvertFrom-Json
          if ($proof.runtimes -isnot [array] -or $proof.runtimes.Count -ne $manifest.runtimes.Count) { throw 'Promotion artifact must cover every manifest host.' }
          $pages = gh api --paginate --slurp "repos/$env:REPOSITORY/actions/runs/$env:VERIFICATION_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $links = @($pages.artifacts | Where-Object { -not $_.expired } | ForEach-Object { "https://github.com/$env:REPOSITORY/actions/runs/$env:VERIFICATION_RUN_ID/artifacts/$($_.id)" })
          for ($i = 0; $i -lt $manifest.runtimes.Count; $i++) {
            $leg = $proof.runtimes[$i]
            $expected = $manifest.runtimes[$i]
            if ($leg.rid -cne $expected.rid -or $leg.runner -cne $expected.runner) { throw 'Promotion RID/runner order differs from the manifest.' }
            foreach ($field in @('total', 'passed', 'failed', 'skipped')) {
              if ($leg.tests.$field -isnot [long] -and $leg.tests.$field -isnot [int]) { throw 'Promotion test totals must be integers.' }
            }
            if ($leg.tests.passed -le 0 -or $leg.tests.failed -ne 0 -or $leg.tests.skipped -lt 0 -or
                $leg.tests.total -ne ($leg.tests.passed + $leg.tests.skipped)) { throw 'Promotion requires successful nonzero per-leg test totals.' }
            if ($leg.results -isnot [array] -or $leg.results.Count -eq 0) { throw 'Promotion leg has no retained results.' }
            foreach ($link in $leg.results) {
              if ($links -cnotcontains $link) { throw 'Promotion result does not link to a retained artifact of the verification run.' }
            }
          }
      - &absence
        name: Check selected target absence and recovery prerequisites
        id: absence
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          FILES: ${{ inputs.files }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
          REPOSITORY: ${{ github.repository }}
          API_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_NOTES -cmatch '\r') { throw 'release-notes must not contain a carriage return.' }
          function Get-Response($url, $token) {
            $headers = @{ Accept = 'application/json' }
            if ($token) {
              $headers.Accept = 'application/vnd.github+json'
              $headers.Authorization = "Bearer $token"
              $headers['X-GitHub-Api-Version'] = '2022-11-28'
            }
            return Invoke-WebRequest -Uri $url -Headers $headers -SkipHttpErrorCheck
          }
          function Read-GitHub($response, $absenceMessage) {
            $value = ConvertFrom-Json -InputObject $response.Content -NoEnumerate
            if ($response.StatusCode -eq 404 -and $absenceMessage -and $value.message -ceq $absenceMessage) { return $null }
            if ($response.StatusCode -ne 200) { throw "GitHub metadata request failed: HTTP $($response.StatusCode)." }
            if ($null -eq $value) { throw 'Malformed GitHub metadata response.' }
            return ,$value
          }
          function Test-GitHubVersion($id) {
            $encoded = [Uri]::EscapeDataString($id)
            for ($page = 1; ; $page++) {
              $response = Get-Response "https://api.github.com/orgs/opencode-dotnet/packages/nuget/$encoded/versions?per_page=100&page=$page" $env:API_TOKEN
              # Package not found. also covers packages this repository's Actions cannot see.
              $versions = Read-GitHub $response 'Package not found.'
              if ($null -eq $versions) { return $false }
              if ($versions -isnot [array]) { throw 'Malformed GitHub package-version response.' }
              foreach ($version in $versions) {
                if ($version.name -isnot [string] -or [string]::IsNullOrEmpty($version.name)) { throw 'Malformed GitHub package version.' }
                if ($version.name -ceq $env:VERSION) { return $true }
              }
              if ($versions.Count -lt 100) { return $false }
            }
          }
          function Test-NuGetVersion($id) {
            $response = Get-Response "https://api.nuget.org/v3-flatcontainer/$($id.ToLowerInvariant())/index.json" ''
            if ($response.StatusCode -eq 404) { return $false }
            if ($response.StatusCode -ne 200) { throw "NuGet metadata request failed: HTTP $($response.StatusCode)." }
            $value = $response.Content | ConvertFrom-Json
            if ($value.versions -isnot [array] -or @($value.versions | Where-Object { $_ -isnot [string] }).Count) { throw 'Malformed NuGet version response.' }
            return $value.versions -ccontains $env:VERSION.ToLowerInvariant()
          }
          $manifest = Get-Content packaging/native-manifest.json -Raw | ConvertFrom-Json
          $ids = @($manifest.runtimes | ForEach-Object { "OpenCodeDotNet.Mcp.$($_.rid)" }) + @('OpenCodeDotNet.Mcp')
          $names = @($ids | ForEach-Object { "$($_).$env:VERSION.nupkg" })
          $selection = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          if ([string]::IsNullOrEmpty($env:FILES)) {
            foreach ($name in $names) { [void]$selection.Add($name) }
          } else {
            if ($env:TARGET -ceq 'github-release') { throw 'files recovers feed pushes only; draft release recovery is not supported.' }
            foreach ($item in $env:FILES.Split(',')) {
              $name = $item.Trim()
              if ($names -cnotcontains $name -or -not $selection.Add($name)) { throw "Unknown or duplicate candidate package basename: $name" }
            }
          }
          $selected = @($names | Where-Object { $selection.Contains($_) })
          "selected=$(ConvertTo-Json -InputObject $selected -Compress)" >> $env:GITHUB_OUTPUT
          foreach ($feed in @('github-packages', 'nuget') | Where-Object { $env:TARGET -ceq $_ -or $env:TARGET -ceq 'dry-run' }) {
            $present = @()
            $missing = @()
            for ($i = 0; $i -lt $ids.Count; $i++) {
              $exists = if ($feed -ceq 'github-packages') { Test-GitHubVersion $ids[$i] } else { Test-NuGetVersion $ids[$i] }
              if ($exists) { $present += $names[$i] } else { $missing += $names[$i] }
            }
            Write-Output "$feed present: $($present -join ', ')"
            $record = if ($feed -ceq 'github-packages') {
              "$feed absent as seen by this repository's Actions access: $($missing -join ', ')"
            } else { "$feed missing: $($missing -join ', ')" }
            Write-Output $record
            $record >> $env:GITHUB_STEP_SUMMARY
            if (@($selected | Where-Object { $present -ccontains $_ }).Count) { throw "$feed already contains a selected version." }
            $root = $names[-1]
            if ($selection.Contains($root)) {
              $unselectedChildren = @($names[0..($names.Count - 2)] | Where-Object { -not $selection.Contains($_) })
              if (@($unselectedChildren | Where-Object { $present -cnotcontains $_ }).Count) { throw "$feed recovery cannot push the root while an unselected child is absent." }
            }
          }
          if ($env:TARGET -in @('github-release', 'dry-run')) {
            if ($env:TARGET -ceq 'github-release' -and [string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) { throw 'Literal approved release-notes are required.' }
            $tag = "v$env:VERSION"
            $releaseScope = if ($env:GITHUB_JOB -ceq 'preflight') { 'published releases' } else { 'releases, including drafts' }
            for ($page = 1; ; $page++) {
              $releases = Read-GitHub (Get-Response "https://api.github.com/repos/$env:REPOSITORY/releases?per_page=100&page=$page" $env:API_TOKEN) ''
              if ($releases -isnot [array]) { throw 'Malformed release-list response.' }
              foreach ($release in $releases) {
                if ($release.tag_name -isnot [string]) { throw 'Malformed release identity.' }
                if ($release.tag_name -ceq $tag) { throw "The release identity already exists in $releaseScope." }
              }
              if ($releases.Count -lt 100) { break }
            }
            $encodedTag = [Uri]::EscapeDataString($tag)
            $ref = Read-GitHub (Get-Response "https://api.github.com/repos/$env:REPOSITORY/git/ref/tags/$encodedTag" $env:API_TOKEN) 'Not Found'
            if ($null -ne $ref) { throw 'The release tag already exists.' }
            $record = if ($env:GITHUB_JOB -ceq 'preflight') {
              'Checked published releases and the tag only; drafts are checked by the github-release job before it creates anything.'
            } else { 'Checked releases, including drafts, and the tag.' }
            Write-Output $record
            $record >> $env:GITHUB_STEP_SUMMARY
          }
      - &feed-download
        name: Download original candidate feed
        uses: actions/download-artifact@v8
        with:
          name: native-package-feed
          path: artifacts/feed
          run-id: ${{ inputs.native-run-id }}
          github-token: ${{ github.token }}
      - &assets-download
        name: Download original candidate release assets
        uses: actions/download-artifact@v8
        with:
          name: native-release-assets
          path: artifacts/release-assets
          run-id: ${{ inputs.native-run-id }}
          github-token: ${{ github.token }}
      - name: Download completed candidate evidence
        uses: actions/download-artifact@v8
        with:
          pattern: native-complete-*
          path: artifacts/native-receipts
          merge-multiple: false
          run-id: ${{ inputs.native-run-id }}
          github-token: ${{ github.token }}
      - name: Build managed native tool entry only
        run: |
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Validate publication candidate bytes
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          dotnet run --no-build tools/native.cs -- publication --receipts artifacts/native-receipts --feed artifacts/feed --assets artifacts/release-assets --version $env:VERSION --commit $env:COMMIT
          exit $LASTEXITCODE
      - name: Record validated feed and nine-release-asset inventories and digests
        id: inventory
        run: &inventory-code |
          $ErrorActionPreference = 'Stop'
          foreach ($kind in @('feed', 'assets')) {
            $root = (Resolve-Path $(if ($kind -ceq 'feed') { 'artifacts/feed' } else { 'artifacts/release-assets' })).Path
            [string[]]$paths = @(Get-ChildItem -LiteralPath $root -Recurse -Force -File | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') })
            [Array]::Sort($paths, [StringComparer]::Ordinal)
            $entries = @($paths | ForEach-Object {
              $file = Get-Item -LiteralPath (Join-Path $root $_)
              [ordered]@{ path = $_; size = $file.Length; sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
            [string[]]$directories = @(Get-ChildItem -LiteralPath $root -Recurse -Force -Directory | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') })
            [Array]::Sort($directories, [StringComparer]::Ordinal)
            $json = ConvertTo-Json -InputObject ([ordered]@{ files = $entries; directories = $directories }) -Depth 6 -Compress
            $expected = if ($kind -ceq 'feed') { $env:EXPECTED_FEED } else { $env:EXPECTED_ASSETS }
            if ($env:GITHUB_JOB -cne 'preflight' -and [string]::IsNullOrEmpty($expected)) { throw 'Validated preflight inventory is required.' }
            if ($expected -and $json -cne $expected) { throw "$kind differs from the validated preflight file set or digests." }
            "$kind=$json" >> $env:GITHUB_OUTPUT
            Write-Output "$kind candidate inventory: $json"
            "$kind candidate inventory: $json" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Record candidate identity SDK and canonical push selection
        id: record
        env:
          COMMIT: ${{ inputs.commit }}
          NATIVE_RUN_ID: ${{ inputs.native-run-id }}
          VERSION: ${{ inputs.version }}
          SELECTED: ${{ steps.absence.outputs.selected }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content packaging/native-manifest.json -Raw | ConvertFrom-Json
          $receipt = Get-Content "artifacts/native-receipts/native-complete-$($manifest.runtimes[0].rid)/receipt.json" -Raw | ConvertFrom-Json
          "sdk-version=$($receipt.sdkVersion)" >> $env:GITHUB_OUTPUT
          $record = "Candidate commit=$env:COMMIT Native-run=$env:NATIVE_RUN_ID version=$env:VERSION receipt-SDK=$($receipt.sdkVersion) selected-child-first-root-last=$env:SELECTED"
          Write-Output $record
          $record >> $env:GITHUB_STEP_SUMMARY

  github-packages:
    if: inputs.target == 'github-packages'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - *checkout
      - *initialize
      - *sdk
      - *feed-download
      - *assets-download
      - &compare
        name: Require exact preflight inventories and digests
        env:
          EXPECTED_FEED: ${{ needs.preflight.outputs.feed }}
          EXPECTED_ASSETS: ${{ needs.preflight.outputs.assets }}
        run: *inventory-code
      - *tree
      - *absence
      - name: Push selected packages once child-first root-last
        env:
          SELECTED: ${{ needs.preflight.outputs.selected }}
          EXPECTED_FEED: ${{ needs.preflight.outputs.feed }}
          PUSH_KEY: ${{ github.token }}
          PUSH_SOURCE: https://nuget.pkg.github.com/opencode-dotnet/index.json
        run: &push-code |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:PUSH_KEY)) { throw 'Publication credential is required.' }
          $selected = ConvertFrom-Json -InputObject $env:SELECTED -NoEnumerate
          $expected = (ConvertFrom-Json -InputObject $env:EXPECTED_FEED).files
          $digests = [ordered]@{}
          foreach ($name in $selected) {
            $digests[$name] = (Get-FileHash -LiteralPath (Join-Path 'artifacts/feed' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $matches = @($expected | Where-Object { $_.path -ceq $name })
            if ($matches.Count -ne 1 -or $digests[$name] -cne $matches[0].sha256) { throw "Package differs from the validated preflight digest: $name" }
          }
          $attempted = [Collections.Generic.List[string]]::new()
          $accepted = [Collections.Generic.List[string]]::new()
          $failed = [Collections.Generic.List[string]]::new()
          try {
            foreach ($name in $selected) {
              $attempted.Add($name)
              try {
                $response = dotnet nuget push (Join-Path 'artifacts/feed' $name) --source $env:PUSH_SOURCE --api-key $env:PUSH_KEY 2>&1
                $code = $LASTEXITCODE
                $text = ($response | Out-String).Replace($env:PUSH_KEY, '<redacted>')
                Write-Output "$name candidate SHA-256=$($digests[$name]) exit=$code`n$text"
                "$name candidate SHA-256=$($digests[$name]) exit=$code`n$text" >> $env:GITHUB_STEP_SUMMARY
                if ($code -ne 0) { throw "Push refused for $name (exit $code)." }
                $accepted.Add($name)
              } catch {
                $failed.Add($name)
                throw
              }
            }
          } finally {
            $record = [ordered]@{ attempted = @($attempted); accepted = @($accepted); failed = @($failed);
              unattempted = @($selected | Where-Object { -not $attempted.Contains($_) }); candidateSha256 = $digests }
            $json = ConvertTo-Json -InputObject $record -Depth 5 -Compress
            Write-Output $json
            $json >> $env:GITHUB_STEP_SUMMARY
            'Accepted push responses do not establish indexed presence. Channel verification supplies that evidence.' >> $env:GITHUB_STEP_SUMMARY
          }

  nuget:
    if: inputs.target == 'nuget'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - *checkout
      - *initialize
      - *sdk
      - *feed-download
      - *assets-download
      - *compare
      - *tree
      - *absence
      - name: NuGet.org login immediately before pushes
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
      - name: Push selected packages once child-first root-last
        env:
          SELECTED: ${{ needs.preflight.outputs.selected }}
          EXPECTED_FEED: ${{ needs.preflight.outputs.feed }}
          PUSH_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PUSH_SOURCE: https://api.nuget.org/v3/index.json
        run: *push-code

  github-release:
    if: inputs.target == 'github-release'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - *checkout
      - *feed-download
      - *assets-download
      - *compare
      - *tree
      - *absence
      - name: Create draft upload read back and publish once
        env:
          API_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
          ASSET_INVENTORY: ${{ needs.preflight.outputs.assets }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_NOTES -cmatch '\r') { throw 'release-notes must not contain a carriage return.' }
          $headers = @{ Authorization = "Bearer $env:API_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:REPOSITORY"
          $tag = "v$env:VERSION"
          $preview = $env:VERSION.Split('+')[0].Contains('-', [StringComparison]::Ordinal)
          $latest = if ($preview) { 'false' } else { 'true' }
          $body = @{ tag_name = $tag; target_commitish = $env:COMMIT; name = $tag; body = $env:RELEASE_NOTES;
            draft = $true; prerelease = $preview; make_latest = $latest; generate_release_notes = $false } | ConvertTo-Json
          $tagBody = @{ ref = "refs/tags/$tag"; sha = $env:COMMIT } | ConvertTo-Json
          $ref = Invoke-WebRequest -Uri "$api/git/refs" -Headers $headers -Method Post -ContentType 'application/json' -Body $tagBody -SkipHttpErrorCheck
          if ($ref.StatusCode -eq 422) { throw 'Release tag creation refused: HTTP 422 (the ref may already exist).' }
          if ($ref.StatusCode -ne 201) { throw "Release tag creation failed: HTTP $($ref.StatusCode)." }
          # The draft binds to whatever commit the tag names, so re-read the new ref just before creating it.
          $created = Invoke-RestMethod -Uri "$api/git/ref/tags/$([Uri]::EscapeDataString($tag))" -Headers $headers
          if ($created.object.type -cne 'commit' -or $created.object.sha -cne $env:COMMIT) { throw 'The new release tag does not point at the candidate commit.' }
          $draft = Invoke-RestMethod -Uri "$api/releases" -Headers $headers -Method Post -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($body))
          if ($draft.draft -ne $true -or $draft.tag_name -cne $tag -or $draft.target_commitish -cne $env:COMMIT -or
              $draft.body -cne $env:RELEASE_NOTES -or $draft.prerelease -ne $preview) { throw 'Created draft differs from the approved release identity.' }
          Write-Output "Draft release $($draft.html_url)"
          "Draft release $($draft.html_url)" >> $env:GITHUB_STEP_SUMMARY
          $expected = (ConvertFrom-Json -InputObject $env:ASSET_INVENTORY).files
          $upload = $draft.upload_url.Split('{')[0]
          foreach ($file in $expected) {
            $name = [Uri]::EscapeDataString($file.path)
            $asset = Invoke-RestMethod -Uri "$($upload)?name=$name" -Headers $headers -Method Post -ContentType 'application/octet-stream' -InFile (Join-Path 'artifacts/release-assets' $file.path)
            Write-Output "Uploaded $($asset.name) API digest=$($asset.digest)"
          }
          $assets = @()
          for ($page = 1; ; $page++) {
            $batch = Invoke-RestMethod -Uri "$api/releases/$($draft.id)/assets?per_page=100&page=$page" -Headers $headers
            if ($batch -isnot [array]) { throw 'Malformed release assets response.' }
            $assets += $batch
            if ($batch.Count -lt 100) { break }
          }
          if ($assets.Count -ne $expected.Count) { throw 'Uploaded asset count differs from the candidate.' }
          $owned = Join-Path $env:RUNNER_TEMP ("release-readback-" + [Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $owned)
          try {
            foreach ($file in $expected) {
              $matches = @($assets | Where-Object { $_.name -ceq $file.path })
              if ($matches.Count -ne 1 -or $matches[0].size -ne $file.size -or $matches[0].state -cne 'uploaded') { throw "Uploaded asset name/size differs: $($file.path)" }
              $asset = $matches[0]
              $download = Join-Path $owned $file.path
              $binaryHeaders = $headers.Clone()
              $binaryHeaders.Accept = 'application/octet-stream'
              Invoke-WebRequest -Uri "$api/releases/assets/$($asset.id)" -Headers $binaryHeaders -OutFile $download
              $digest = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -cne $file.sha256) { throw "Release asset read-back digest differs: $($file.path)" }
              $record = "$($file.path) candidate/read-back SHA-256=$digest API digest=$($asset.digest)"
              Write-Output $record
              $record >> $env:GITHUB_STEP_SUMMARY
            }
          } finally {
            Remove-Item -LiteralPath $owned -Recurse -Force
          }
          $publish = @{ draft = $false; make_latest = $latest } | ConvertTo-Json
          # Publication binds the release to the tag's commit at this moment, so check the tag again first.
          $beforePublish = Invoke-RestMethod -Uri "$api/git/ref/tags/$([Uri]::EscapeDataString($tag))" -Headers $headers
          if ($beforePublish.object.type -cne 'commit' -or $beforePublish.object.sha -cne $env:COMMIT) { throw 'The release tag no longer points at the candidate commit; the draft is left unpublished.' }
          $release = Invoke-RestMethod -Uri "$api/releases/$($draft.id)" -Headers $headers -Method Patch -ContentType 'application/json' -Body $publish
          $confirmed = Invoke-RestMethod -Uri "$api/releases/$($draft.id)" -Headers $headers
          if ($release.draft -ne $false -or $confirmed.draft -ne $false -or $confirmed.tag_name -cne $tag -or
              $confirmed.target_commitish -cne $env:COMMIT -or $confirmed.body -cne $env:RELEASE_NOTES -or $confirmed.prerelease -ne $preview) {
            throw 'Published release does not identify the approved candidate.'
          }
          $encodedTag = [Uri]::EscapeDataString($tag)
          $ref = Invoke-RestMethod -Uri "$api/git/ref/tags/$encodedTag" -Headers $headers
          $object = $ref.object
          while ($object.type -ceq 'tag') {
            $annotated = Invoke-RestMethod -Uri "$api/git/tags/$($object.sha)" -Headers $headers
            $object = $annotated.object
          }
          if ($object.type -cne 'commit' -or $object.sha -cne $env:COMMIT) { throw 'Published peeled tag does not identify the candidate commit.' }
          Write-Output "Published $($confirmed.html_url) at $env:COMMIT"
          "Published $($confirmed.html_url) at $env:COMMIT" >> $env:GITHUB_STEP_SUMMARY
