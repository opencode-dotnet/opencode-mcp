name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          switch -CaseSensitive ($env:EVENT) {
            'push' {
              'code=true' >> $env:GITHUB_OUTPUT
              exit 0
            }
            'pull_request' {
              $base = git rev-parse HEAD^1
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the pull request base.' }
            }
            'merge_group' {
              git fetch --no-tags --depth=1 origin $env:QUEUE_BASE
              if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the merge group base.' }
              $base = $env:QUEUE_BASE
            }
            default { throw 'Unsupported classification event.' }
          }

          # PowerShell 7.4+ preserves native stdout bytes when redirecting to a file.
          # No rename detection: a source-to-Markdown rename still deletes a source path.
          $diffPath = Join-Path $env:RUNNER_TEMP 'changed-paths'
          git diff --name-only --no-renames -z $base HEAD > $diffPath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the changed paths.' }
          $paths = [System.IO.File]::ReadAllText($diffPath, [System.Text.UTF8Encoding]::new($false, $true))
          $code = 'false'
          if ($paths.Length -gt 0) {
            if ($paths[-1] -ne [char]0) { throw 'Changed paths are not NUL-terminated.' }
            foreach ($path in $paths.Substring(0, $paths.Length - 1).Split([char]0)) {
              if ($path.Length -eq 0) { throw 'Changed paths contain an empty entry.' }
              if (-not $path.EndsWith('.md', [System.StringComparison]::Ordinal) -and $path -cne 'LICENSE') {
                $code = 'true'
              }
            }
          }
          "code=$code" >> $env:GITHUB_OUTPUT

      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        run: |
          $ErrorActionPreference = 'Stop'
          $trees = git rev-parse 'HEAD^{tree}' 'HEAD^1^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the tested trees.' }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'tested-tree'), ($trees -join "`n") + "`n")

      - name: Upload the tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 7
          if-no-files-found: error

  reuse:
    name: Reuse tested tree
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.guard.outputs.reuse || steps.decide.outputs.reuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard against self-vouching before executing repository tooling
        id: guard
        env:
          QUEUE_REF: ${{ github.ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_FETCH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $facts = Join-Path $env:RUNNER_TEMP 'reuse'
          New-Item -ItemType Directory -Path $facts | Out-Null
          function Save-Fact($name, $value) { [IO.File]::WriteAllText((Join-Path $facts $name), $value) }
          function Save-Revision($name, $revision) {
            $sha = git rev-parse --verify $revision
            if ($LASTEXITCODE -ne 0) { $sha = '' }
            Save-Fact $name $sha
            return $sha
          }
          Save-Fact 'queue-ref' $env:QUEUE_REF
          Save-Fact 'base' $env:QUEUE_BASE
          $null = Save-Revision 'tree' 'HEAD^{tree}'
          $parents = git rev-list --parents -n 1 HEAD
          $parentCount = if ($LASTEXITCODE -eq 0) { $parents.Split(' ').Length - 1 } else { '' }
          Save-Fact 'parent-count' $parentCount
          $head = Save-Revision 'head' 'HEAD^2'
          $reason = & {
            try {
              if ($parentCount -ne 2 -or !$head) { throw 'Cannot resolve the guard revisions.' }
              # Determine the common ancestor before the shallow fetch can change the history walk.
              $mergeBase = git merge-base 'HEAD^1' $head
              $mergeBaseExit = $LASTEXITCODE
              $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:QUEUE_FETCH_TOKEN"))
              $env:QUEUE_FETCH_AUTH = "AUTHORIZATION: basic $credential"
              git --config-env=http.https://github.com/.extraheader=QUEUE_FETCH_AUTH fetch --no-tags --depth=1 origin refs/heads/master | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch master.' }
              $masterTip = git rev-parse --verify FETCH_HEAD
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the fetched master tip.' }
              if ($env:QUEUE_BASE -cne $masterTip -or $parents.Split(' ')[1] -cne $masterTip) { return 'rule 5: base differs from master' }
              if ($mergeBaseExit -ne 0) { throw 'Cannot resolve the merge base.' }
              $paths = Join-Path $facts 'changed-paths'
              git diff --name-only --no-renames -z $mergeBase $head > $paths
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read the changed paths.' }
              if (!(Save-Revision 'base-tree' "$($env:QUEUE_BASE)^{tree}")) { throw 'Cannot resolve the base tree.' }
              $comparison = [StringComparison]::OrdinalIgnoreCase
              # Keep these guarded paths in sync with MergeGroupReuseDecision.IsGuarded.
              foreach ($path in [IO.File]::ReadAllText($paths, [Text.UTF8Encoding]::new($false, $true)).Split([char]0)) {
                $leaf = $path.Split('/')[-1]
                if ($path.StartsWith('.github/', $comparison) -or $path.StartsWith('tools/', $comparison) -or
                    $leaf.StartsWith('Directory.Build.', $comparison) -or $leaf.Equals('Directory.Packages.props', $comparison) -or
                    $leaf.Equals('global.json', $comparison) -or $leaf.Equals('nuget.config', $comparison)) {
                  return 'rule 5: guarded path'
                }
              }
            } catch {
              'unavailable guard facts'
            }
          }
          $env:QUEUE_FETCH_AUTH = $null
          $env:QUEUE_FETCH_TOKEN = $null
          git config --local --unset-all http.https://github.com/.extraheader 2>$null
          $global:LASTEXITCODE = 0
          if ($reason) {
            @('reuse=false', "reason=$reason", 'blocked=true') >> $env:GITHUB_OUTPUT
            @('### Merge-group reuse', 'reuse=false', "reason=$reason") >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0

      - name: Setup .NET SDK
        if: steps.guard.outputs.blocked != 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log resolved SDK
        if: steps.guard.outputs.blocked != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --version
          exit $LASTEXITCODE

      - name: Gather GitHub facts
        id: facts
        if: steps.guard.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $facts = Join-Path $env:RUNNER_TEMP 'reuse'
          $api = "repos/$env:GITHUB_REPOSITORY"
          function Get-Fact($name, $endpoint, $collection) {
            $file = Join-Path $facts $name
            [IO.File]::WriteAllText($file, '')
            if (!$endpoint) { return }
            try {
              if ($collection) {
                $pages = gh api --paginate --slurp $endpoint
                if ($LASTEXITCODE -ne 0) { throw "Cannot fetch $name." }
                # Check the fetch before flattening its pages. jq preserves the timestamp strings.
                $pages | jq --arg collection $collection '{($collection): [ .[][$collection][] ]}' > $file
              } else {
                gh api $endpoint > $file
              }
              if ($LASTEXITCODE -ne 0) { throw "Cannot write $name." }
              if ($collection -cin 'workflow_runs', 'artifacts') {
                Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
              }
            } catch {
              Write-Warning "Cannot gather $name."
              [IO.File]::WriteAllText($file, '')
            }
          }
          $queue = ([string](Get-Content (Join-Path $facts 'queue-ref') -Raw)).Trim()
          $head = ([string](Get-Content (Join-Path $facts 'head') -Raw)).Trim()
          $prEndpoint = if ($queue -cmatch '^refs/heads/gh-readonly-queue/master/pr-(\d+)-') { "$api/pulls/$($Matches[1])" }
          $null = Get-Fact 'pr.json' $prEndpoint
          $runs = Get-Fact 'runs.json' "$api/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&per_page=100" 'workflow_runs'
          $latest = $runs.workflow_runs | Where-Object { $_.path -ceq '.github/workflows/ci.yml' -and $_.event -ceq 'pull_request' -and $_.head_sha -ceq $head } |
            Sort-Object -Property created_at, id -Descending | Select-Object -First 1
          $id, $attempt = $latest.id, $latest.run_attempt
          $run = if ($id -and $attempt) { "$api/actions/runs/$id" }
          $null = Get-Fact 'jobs.json' $(if ($run) { "$run/attempts/$attempt/jobs?per_page=100" }) 'jobs'
          $artifacts = Get-Fact 'artifacts.json' $(if ($run) { "$run/artifacts?per_page=100" }) 'artifacts'
          $treeFile = Join-Path $facts 'tested-tree'
          [IO.File]::WriteAllText($treeFile, '')
          if ($run) { "link=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$id/attempts/$attempt" >> $env:GITHUB_OUTPUT }
          $artifact = @($artifacts.artifacts | Where-Object { $_.name -ceq "tested-tree-$attempt" -and $_.expired -eq $false })
          if ($artifact.Count -ne 1 -or !$artifact[0].id) { exit 0 }
          try {
            $zipFile = Join-Path $facts 'artifact.zip'
            gh api "$api/actions/artifacts/$($artifact[0].id)/zip" > $zipFile
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download artifact.' }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead($zipFile)
            $entry = @($zip.Entries | Where-Object { $_.FullName -ceq 'tested-tree' })
            if ($entry.Count -ne 1) { throw 'Expected one tested-tree entry.' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry[0], $treeFile, $true)
          } catch {
            Write-Warning 'Cannot extract the tested tree.'
            [IO.File]::WriteAllText($treeFile, '')
          } finally {
            if ($zip) { $zip.Dispose() }
          }
          exit 0

      - name: Decide reuse
        id: decide
        if: steps.guard.outputs.blocked != 'true'
        env:
          REUSED_RUN: ${{ steps.facts.outputs.link }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- merge-group-reuse --facts (Join-Path $env:RUNNER_TEMP 'reuse') --output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @('### Merge-group reuse', (Get-Content $env:GITHUB_OUTPUT -Raw), "Run: $env:REUSED_RUN") >> $env:GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    needs: [changes, reuse]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && !(needs.reuse.result == 'success' && needs.reuse.outputs.reuse == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize owned Aspire home
        run: |
          $ErrorActionPreference = 'Stop'
          $homePath = Join-Path $env:RUNNER_TEMP 'aspire-home'
          $dashboardPath = Join-Path $homePath 'dashboard'
          New-Item -ItemType Directory -Path $dashboardPath | Out-Null
          "ASPIRE_HOME=$homePath" >> $env:GITHUB_ENV
          "ASPIRE_DASHBOARD_DATA_DIRECTORY=$dashboardPath" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log resolved SDK
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --version
          exit $LASTEXITCODE

      - name: Restore local tools
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool restore
          exit $LASTEXITCODE

      - name: Detect slop
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool run slopwatch analyze --exclude ".scratchpad/**" --fail-on warning
          exit $LASTEXITCODE

      - name: Build with analyzers
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build OpenCode.Mcp.slnx --configuration Release
          exit $LASTEXITCODE

      - name: Verify whitespace
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format whitespace OpenCode.Mcp.slnx --verify-no-changes --no-restore
          exit $LASTEXITCODE

      - name: Verify style
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format style OpenCode.Mcp.slnx --verify-no-changes --no-restore --severity warn
          exit $LASTEXITCODE

      - name: Verify native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $emptyReceipts = Join-Path $env:RUNNER_TEMP ('native-empty-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $emptyReceipts | Out-Null
          try {
            $diagnostic = dotnet run tools/native.cs -- validate --receipts $emptyReceipts 2>&1
            $exitCode = $LASTEXITCODE
            $expected = (Get-Content packaging/native-manifest.json -Raw | ConvertFrom-Json).runtimes |
              ForEach-Object { 'Missing receipt: ' + $_.rid }
            if ($exitCode -ne 2 -or ($diagnostic -join "`n").Trim() -cne ($expected -join "`n")) {
              throw ('Native entry smoke failed: ' + ($diagnostic -join "`n"))
            }
          } finally {
            Remove-Item -LiteralPath $emptyReceipts -Recurse -Force
          }
          exit 0

  build-and-test:
    name: Build and test (${{ matrix.os }})
    needs: [changes, reuse]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && !(needs.reuse.result == 'success' && needs.reuse.outputs.reuse == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
        include:
          - { os: windows-2025, badge: windows }
          - { os: ubuntu-24.04, badge: linux }
          - { os: macos-15, badge: macos }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize owned Aspire home
        run: |
          $ErrorActionPreference = 'Stop'
          $homePath = Join-Path $env:RUNNER_TEMP 'aspire-home'
          $dashboardPath = Join-Path $homePath 'dashboard'
          New-Item -ItemType Directory -Path $dashboardPath | Out-Null
          "ASPIRE_HOME=$homePath" >> $env:GITHUB_ENV
          "ASPIRE_DASHBOARD_DATA_DIRECTORY=$dashboardPath" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log resolved SDK
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --version
          exit $LASTEXITCODE

      - name: Build
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build OpenCode.Mcp.slnx --configuration Release -p:RunAnalyzers=false
          exit $LASTEXITCODE

      - name: Build native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          exit $LASTEXITCODE

      - name: Test
        id: test
        timeout-minutes: 35
        env:
          TUNIT_DISABLE_ARTIFACT_UPLOAD: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --solution OpenCode.Mcp.slnx --configuration Release --no-build --treenode-filter "/*/*/*/*[Category!=Package]" --report-trx --results-directory artifacts/test-results --minimum-expected-tests 1 --timeout 25m --hangdump --hangdump-timeout 15m --hangdump-type Mini
          exit $LASTEXITCODE

      - name: List tests after failure
        if: ${{ failure() && !cancelled() && steps.build.outcome == 'success' && steps.test.outcome == 'failure' }}
        timeout-minutes: 5
        env:
          TUNIT_DISABLE_ARTIFACT_UPLOAD: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --solution OpenCode.Mcp.slnx --configuration Release --no-build --treenode-filter "/*/*/*/*[Category!=Package]" --list-tests
          exit $LASTEXITCODE

      - name: Publish test results
        id: test-results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        # A fork pull request has no checks permission; let it fail without failing the run.
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          name: "Test Results (${{ matrix.badge }})"
          path: "artifacts/test-results/**/*.trx"
          reporter: dotnet-trx
          path-replace-backslashes: true
          fail-on-error: true

      # The test badge is status only: posting never fails CI. The tool exits 0 on a failed post,
      # and continue-on-error covers the pre-flight checks too. A failing master run still posts its
      # counts. The composite action lives under .github/workflows/ in its repository, where a
      # remote step reference is refused, so the pinned commit is checked out and used by local path.
      - name: Checkout BadgeSmith action
        if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: localstack-dotnet/badge-smith
          # The commit the live api.localstackfor.net deployment runs, so the signing tool and the
          # server stay in step.
          ref: bc7ed07860ec4b0e702add6370c2636daccb2adf
          path: .badge-smith
          persist-credentials: false

      - name: Update test badge via BadgeSmith API
        if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: ./.badge-smith/.github/workflows/update-test-badge
        with:
          platform: ${{ matrix.badge }}
          test_passed: '${{ steps.test-results.outputs.passed || 0 }}'
          test_failed: '${{ steps.test-results.outputs.failed || 0 }}'
          test_skipped: '${{ steps.test-results.outputs.skipped || 0 }}'
          test_url_html: ${{ steps.test-results.outputs.url_html || '' }}
          commit_sha: '${{ github.sha }}'
          run_id: '${{ github.run_id }}'
          repository: '${{ github.repository }}'
          server_url: '${{ github.server_url }}'
          api_base_url: 'https://api.localstackfor.net'
          hmac_secret: '${{ secrets.TESTDATASECRET }}'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/**
          retention-days: 7
      - name: Record processes after tests
        if: always()
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE

      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: process-snapshot-${{ matrix.os }}
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: 7

  ci-result:
    name: CI result
    needs: [changes, reuse, lint, build-and-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job
        env:
          EVENT: ${{ github.event_name }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          REUSE: ${{ needs.reuse.outputs.reuse }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "event=$env:EVENT reuse-result=$env:REUSE_RESULT reuse=$env:REUSE changes=$env:CHANGES code=$env:CODE lint=$env:LINT build-and-test=$env:BUILD_AND_TEST"
          $errors = [System.Collections.Generic.List[string]]::new()
          if ($env:CHANGES -cne 'success') { $errors.Add('Changes must succeed.') }
          if ($env:REUSE_RESULT -ceq 'success' -and $env:REUSE -ceq 'true') {
            if ($env:EVENT -cne 'merge_group') { $errors.Add('Reuse requires a merge group.') }
            if ($env:CODE -cne 'true' -and $env:CODE -cne 'false') { $errors.Add('Code classification must be true or false.') }
            if ($env:LINT -cne 'skipped') { $errors.Add('Reuse requires skipped lint.') }
            if ($env:BUILD_AND_TEST -cne 'skipped') { $errors.Add('Reuse requires skipped build/test legs.') }
          } else {
            switch -CaseSensitive ($env:CODE) {
              'true' {
                if ($env:LINT -cne 'success') { $errors.Add('Code changes require successful lint.') }
                if ($env:BUILD_AND_TEST -cne 'success') { $errors.Add('Code changes require successful build/test legs.') }
              }
              'false' {
                if ($env:LINT -cne 'skipped') { $errors.Add('Documentation-only changes require skipped lint.') }
                if ($env:BUILD_AND_TEST -cne 'skipped') { $errors.Add('Documentation-only changes require skipped build/test legs.') }
              }
              default { $errors.Add('Code classification must be true or false.') }
            }
          }
          foreach ($message in $errors) { Write-Output "::error::$message" }
          if ($errors.Count -gt 0) { exit 1 }
