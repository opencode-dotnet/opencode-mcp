                    $quotedFishPath = $bin.Replace('\', '\\').Replace("'", "\'")
                    Assert-Equal ([IO.File]::ReadAllText($startup)) "if not contains -- '$quotedFishPath' `$PATH; set -gx PATH '$quotedFishPath' `$PATH; end`n" 'Exact fish quoting supports apostrophes'
                    $ownedBytes = [IO.File]::ReadAllBytes($startup)
                    try {
                      [IO.File]::AppendAllText($startup, '# changed')
                      Assert-Result (Invoke-Installer $uninstall) 2 @("opencode-mcp: PATH ownership is ambiguous: $startup.")
                    } finally { [IO.File]::WriteAllBytes($startup, $ownedBytes) }
                  }
                  Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                  if ($windows) {
                    $expectedRaw = if ([string]::IsNullOrEmpty($prefix)) { 'installer-neighbor' } else { $prefix + ';installer-neighbor' }
                    Assert-Equal (Get-RawPath) $expectedRaw 'Exact raw representation preserves neighboring tokens'
                    Restore-RawPath
                  }
                  elseif ($shell -ne 'fish') {
                    $expectedBytes = [byte[]]($prefix + [Text.Encoding]::UTF8.GetBytes("`n# installer-neighbor`n"))
                    Assert-Equal ([Convert]::ToBase64String([IO.File]::ReadAllBytes($startup))) ([Convert]::ToBase64String($expectedBytes)) 'Exact surrounding startup bytes survive'
                    Assert-Equal (Get-Item -LiteralPath $startup).UnixFileMode $permissions 'Startup permissions survive'
                  }
                  else { Assert-Equal (Test-Path -LiteralPath $startup) $false 'Owned fish file removed' }
                  Assert-Equal (Test-Path -LiteralPath $bin) $false 'Successful uninstall retry removes command directory'
                  Assert-Equal (Test-Path -LiteralPath $private) $false 'Successful uninstall retry removes private root'
                  # The next shell starts from an installed state, then explicitly removes it.
                  Assert-Result (Invoke-Installer @()) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
                }
                Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                if (-not $windows) {
                  $env:SHELL = '/bin/sh'; $startup = Join-Path $HOME '.profile'
                  Remove-Item -LiteralPath $startup
                  Assert-Result (Invoke-Installer $addPath) 0 @($installedMessage, 'opencode-mcp: PATH updated for future login sessions.')
                  Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                  Assert-Equal (Test-Path -LiteralPath $startup) $false 'Installer-created startup file disappears when empty'
                  $env:SHELL = '/bin/zsh'; $env:ZDOTDIR = Join-Path $root 'rollback-startup'
                  New-Item -ItemType Directory $env:ZDOTDIR | Out-Null
                  $startup = Join-Path $env:ZDOTDIR '.zprofile'; Save-Startup $startup
                  $quotedStartup = $startup.Replace("'", "'\''"); $quotedParent = $env:ZDOTDIR.Replace("'", "'\''")
                  [IO.File]::WriteAllText($moveFixture, "#!/bin/sh`n'$realMove' `"`$@`" || exit 1`ncase `"`$3`" in '$quotedStartup') chmod a-w '$quotedParent'; kill -TERM `"`$PPID`";; esac`n")
                  & chmod +x $moveFixture; if ($LASTEXITCODE -ne 0) { throw 'Rollback fixture chmod failed.' }
                  try {
                    $env:PATH = $signalCommands + ':' + $originalPath
                    Assert-Result (Invoke-Installer $addPath) 143 @("opencode-mcp: Cleanup failed; retained owned directory: $data.")
                    Assert-Equal ([IO.File]::ReadAllLines((Join-Path $data 'path.record'))[0]) $startup 'Failed PATH rollback retains the owned startup record'
                    Assert-Equal ([IO.File]::ReadAllLines($startup)[0]) "# >>> opencode-mcp $data >>>" 'Failed PATH rollback retains its exact block'
                    Assert-Equal @(Get-ChildItem -LiteralPath $env:ZDOTDIR -Force | ForEach-Object Name) @('.zprofile') 'Failed startup rewrite leaves no temporary file'
                  } finally {
                    $env:PATH = $originalPath
                    & chmod u+w $env:ZDOTDIR; if ($LASTEXITCODE -ne 0) { throw 'Rollback fixture cleanup failed.' }
                    @($data, $bin) | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Remove-Item -LiteralPath $_ -Recurse }
                    $env:SHELL = '/bin/sh'
                  }
                }
              }
              Invoke-Case Install_Preserves_Preexisting_Path {
                $entry = if ($windows) { Join-Path $bin 'current' } else { $bin }
                $env:PATH = $entry + [IO.Path]::PathSeparator + $originalPath
                if ($windows) { $kind = if ($null -eq $rawPath) { [Microsoft.Win32.RegistryValueKind]::ExpandString } else { $rawKind }; $userKey.SetValue('Path', $entry + ';' + $rawPath, $kind) }
                Assert-Result (Invoke-Installer $addPath) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
                Assert-Equal (Test-Path -LiteralPath (Join-Path $private 'path.record')) $false 'Preexisting PATH is not claimed'
                Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                Assert-Equal ($env:PATH.Split([IO.Path]::PathSeparator)[0]) $entry 'Preexisting process token survives'
                if ($windows) { Assert-Equal ((Get-RawPath) -split ';' | Select-Object -First 1) $entry 'Preexisting raw token survives'; Restore-RawPath }
                $env:PATH = $originalPath
              }
              Invoke-Case Truncated_Download_Executes_Nothing {
                $truncated = $text.Substring(0, $text.LastIndexOf("`n", $text.TrimEnd().Length - 1) + 1)
                $result = Invoke-Installer @() $assets $bin $data $truncated
                Assert-Result $result 0 @()
                Assert-Equal $result.Stdout '' 'Truncated stream has empty stdout'
                Assert-Equal $result.Stderr '' 'Truncated stream has empty stderr'
                Assert-Equal (Test-Path -LiteralPath $bin) $false 'Truncated stream never mutates destination'
                Assert-Equal (Test-Path -LiteralPath $data) $false 'Truncated stream never creates data directory'
              }
              # Native startup always selects the untouched candidate, never the alternate fixture.
              Assert-Result (Invoke-Installer @()) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
              Assert-Installed
              $env:OPENCODE_MCP_TEST_EXECUTABLE = $command
              $env:OPENCODE_MCP_TEST_EXPECT_NATIVE = 'true'
              dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter '/*/*/ExecutableTests/*' --report-trx --results-directory "artifacts/test-results/installer/$rid/$($PSVersionTable.PSVersion.Major)" --minimum-expected-tests 1 --timeout 25m --hangdump --hangdump-timeout 15m --hangdump-type Mini
              if ($LASTEXITCODE -ne 0) { throw "Installed ExecutableTests failed: $LASTEXITCODE" }
              Invoke-Case Uninstall_Leaves_Nothing {
                Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                Assert-Equal (Test-Path -LiteralPath $bin) $false 'Exact installation root absent'
                Assert-Equal (Test-Path -LiteralPath $private) $false 'Exact private root absent'
                Assert-Equal ([IO.File]::ReadAllText((Join-Path $root 'neighbor'))) 'neighbor unchanged' 'Named sibling sentinel preserved'
              }
            } catch { $failure = $_ } finally {
              # ExecutableTests owns and awaits its native children before it returns.
              $env:PATH = $originalPath
              if (Test-Path -LiteralPath (Join-Path $private 'owner')) {
                $cleanup = Invoke-Installer $uninstall
                if ($cleanup.Code -ne 0) { $cleanupErrors += ($cleanup.Lines -join "`n") }
              }
              foreach ($path in $snapshots.Keys) {
                if ($null -eq $snapshots[$path]) { if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path } }
                else { [IO.File]::WriteAllBytes($path, $snapshots[$path]) }
              }
              if ($windows) { Restore-RawPath; $userKey.Dispose() }
              $env:SHELL = $originalShell; $env:ZDOTDIR = $originalZdot; $env:XDG_CONFIG_HOME = $originalConfig
              $env:OPENCODE_MCP_TEST_EXECUTABLE = $null; $env:OPENCODE_MCP_TEST_EXPECT_NATIVE = $null
              if ($cleanupErrors.Count -eq 0 -and (Test-Path -LiteralPath $root)) { Remove-Item -LiteralPath $root -Recurse }
            }
            if ($failure -or $cleanupErrors.Count) { throw ((@($failure | Where-Object { $null -ne $_ }) + $cleanupErrors) -join "`n") }
          }
          $caseFile = Join-Path $env:RUNNER_TEMP 'installer-cases.ps1'
          [IO.File]::WriteAllText($caseFile, $cases.ToString())
          & pwsh -NoProfile -File $caseFile
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 installer lifecycle failed.' }
      - name: Installer lifecycle cases and installed ExecutableTests (Windows PowerShell 5.1)
        id: legacy-test
        if: ${{ !cancelled() && startsWith(matrix.rid, 'win-') }}
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          if (-not (Test-Path -LiteralPath $legacy)) { throw 'Windows PowerShell 5.1 is required.' }
          & $legacy -NoProfile -File (Join-Path $env:RUNNER_TEMP 'installer-cases.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 installer lifecycle failed.' }
      - name: List executable tests after failure
        if: ${{ failure() && !cancelled() && steps.build.outcome == 'success' && (steps.test.outcome == 'failure' || steps.legacy-test.outcome == 'failure') }}
        timeout-minutes: 5
        run: |
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/ExecutableTests/*" --list-tests
          exit $LASTEXITCODE
      - name: Record processes after tests
        if: always()
        run: |
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE
      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-process-snapshot-installer-${{ matrix.rid }}
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload installer test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-installer-test-results-${{ matrix.rid }}
          path: artifacts/test-results/installer/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  consumer:
    name: Acquire (${{ matrix.rid }})
    needs: [prepare, packages]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.consumer-matrix) }}
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
          if ($IsWindows) {
            "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
            "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          }
          "OPENCODE_MCP_TEST_FEED=$(Join-Path $env:GITHUB_WORKSPACE 'artifacts/feed')" >> $env:GITHUB_ENV
          "OPENCODE_MCP_TEST_RID=${{ matrix.rid }}" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
          architecture: ${{ endsWith(matrix.rid, '-arm64') && 'arm64' || 'x64' }}
      - name: Download complete package feed
        uses: actions/download-artifact@v8
        with:
          name: native-package-feed
          path: artifacts/feed
      - name: Build native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Build product test runner
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release -nodeReuse:false -p:UseSharedCompilation=false
          exit $LASTEXITCODE
      - name: Test packages
        id: test
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/*/*[Category=Package]" --report-trx --results-directory artifacts/test-results/package/product --minimum-expected-tests 1 --timeout 25m --hangdump --hangdump-timeout 15m --hangdump-type Mini
          exit $LASTEXITCODE
      - name: List package tests after failure
        if: ${{ failure() && !cancelled() && steps.build.outcome == 'success' && steps.test.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/*/*[Category=Package]" --list-tests
          exit $LASTEXITCODE
      - name: Record processes after tests
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE
      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-process-snapshot-consumer-${{ matrix.rid }}
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload package test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-package-test-results-consumer-${{ matrix.rid }}
          path: artifacts/test-results/package/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
