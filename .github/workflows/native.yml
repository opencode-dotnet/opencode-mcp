name: Native

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  TUNIT_DISABLE_ARTIFACT_UPLOAD: "true"
  NATIVE_ARTIFACT_RETENTION_DAYS: ${{ github.event_name == 'workflow_dispatch' && 90 || 7 }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sdk-version: ${{ steps.sdk.outputs.dotnet-version }}
      linux-matrix: ${{ steps.matrix.outputs.linux-matrix }}
      native-matrix: ${{ steps.matrix.outputs.native-matrix }}
      consumer-matrix: ${{ steps.matrix.outputs.consumer-matrix }}
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        id: sdk
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Project native matrices
        id: matrix
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- matrix --manifest packaging/native-manifest.json --github-output $env:GITHUB_OUTPUT
          exit $LASTEXITCODE

  build-linux:
    name: Build (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.builderImage }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux-matrix) }}
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mark checked-out workspace safe for Git
        run: |
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
          architecture: ${{ endsWith(matrix.rid, '-arm64') && 'arm64' || 'x64' }}
      - name: Build native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Verify published native executable
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- verify --rid ${{ matrix.rid }}
          exit $LASTEXITCODE
      - name: Verify framework-dependent control
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- control --rid ${{ matrix.rid }}
          exit $LASTEXITCODE
      - name: Stage and verify archive
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- stage --rid ${{ matrix.rid }} --publish-directory artifacts/native/${{ matrix.rid }}/publish
          exit $LASTEXITCODE
      - name: Pack child package
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- pack-child --rid ${{ matrix.rid }} --evidence artifacts/native/${{ matrix.rid }}
          exit $LASTEXITCODE
      - name: List executable tests after failure
        if: ${{ failure() && !cancelled() && hashFiles(format('artifacts/test-results/native/{0}/**/execution.log', matrix.rid)) != '' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/ExecutableTests/*" --list-tests
          exit $LASTEXITCODE
      - name: Record processes after tests
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE
      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-process-snapshot-build-linux-${{ matrix.rid }}
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-build-linux-${{ matrix.rid }}
          path: artifacts/test-results/native/${{ matrix.rid }}/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
      - name: Upload Linux build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}/**
            !artifacts/native/${{ matrix.rid }}/publish/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload native symbols
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/publish/**/*.dbg
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}

  build-native:
    name: Build (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.native-matrix) }}
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
          if ($IsWindows) {
            "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
            "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          }
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
          architecture: ${{ endsWith(matrix.rid, '-arm64') && 'arm64' || 'x64' }}
      - name: Build native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Verify published native executable
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- verify --rid ${{ matrix.rid }}
          exit $LASTEXITCODE
      - name: Verify framework-dependent control
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- control --rid ${{ matrix.rid }}
          exit $LASTEXITCODE
      - name: Stage and verify archive
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- stage --rid ${{ matrix.rid }} --publish-directory artifacts/native/${{ matrix.rid }}/publish
          exit $LASTEXITCODE
      - name: Pack child package
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- pack-child --rid ${{ matrix.rid }} --evidence artifacts/native/${{ matrix.rid }}
          exit $LASTEXITCODE
      - name: List executable tests after failure
        if: ${{ failure() && !cancelled() && hashFiles(format('artifacts/test-results/native/{0}/**/execution.log', matrix.rid)) != '' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/ExecutableTests/*" --list-tests
          exit $LASTEXITCODE
      - name: Record processes after tests
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE
      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-process-snapshot-build-native-${{ matrix.rid }}
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-build-native-${{ matrix.rid }}
          path: artifacts/test-results/native/${{ matrix.rid }}/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
      - name: Upload completed native evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: native-complete-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}/**
            !artifacts/native/${{ matrix.rid }}/publish/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-failure-build-native-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}/**
            !artifacts/native/${{ matrix.rid }}/publish/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
      - name: Upload native symbols
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}/publish/**/*.pdb
            artifacts/native/${{ matrix.rid }}/publish/**/*.dSYM/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}

  prove-linux:
    name: Prove (${{ matrix.rid }})
    needs: [prepare, build-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux-matrix) }}
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
          architecture: ${{ endsWith(matrix.rid, '-arm64') && 'arm64' || 'x64' }}
      - name: Download matching Linux build
        uses: actions/download-artifact@v8
        with:
          name: native-build-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
      - name: Build product test runner
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release -nodeReuse:false -p:UseSharedCompilation=false
          exit $LASTEXITCODE
      - name: Build native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Pull clean runtime image
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull ${{ matrix.runtimeImage }}
          exit $LASTEXITCODE
      - name: Prove Linux runtime independence
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- prove-linux --rid ${{ matrix.rid }} --evidence artifacts/native/${{ matrix.rid }}
          exit $LASTEXITCODE
      - name: List executable tests after failure
        if: ${{ failure() && !cancelled() && hashFiles(format('artifacts/test-results/native/{0}/**/execution.log', matrix.rid)) != '' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/ExecutableTests/*" --list-tests
          exit $LASTEXITCODE
      - name: Record processes after tests
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE
      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-process-snapshot-prove-linux-${{ matrix.rid }}
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results-prove-linux-${{ matrix.rid }}
          path: artifacts/test-results/native/${{ matrix.rid }}/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
      - name: Upload completed Linux evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: native-complete-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload Linux failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-failure-prove-linux-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}

  validate:
    name: Validate native receipts
    needs: [prepare, build-linux, build-native, prove-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
      - name: Download completed native evidence
        uses: actions/download-artifact@v8
        with:
          pattern: native-complete-*
          path: artifacts/native-receipts
          merge-multiple: false
      - name: Validate complete native receipt set
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run tools/native.cs -- validate --receipts artifacts/native-receipts
          exit $LASTEXITCODE

  packages:
    name: Pack and inspect complete feed
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
          "OPENCODE_MCP_TEST_FEED=$(Join-Path $env:GITHUB_WORKSPACE 'artifacts/feed')" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
      - name: Download completed native evidence
        uses: actions/download-artifact@v8
        with:
          pattern: native-complete-*
          path: artifacts/native-receipts
          merge-multiple: false
      - name: Build native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Build product test runner
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release -nodeReuse:false -p:UseSharedCompilation=false
          exit $LASTEXITCODE
      - name: Pack root and validate complete feed
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- pack-root --receipts artifacts/native-receipts --feed artifacts/feed
          exit $LASTEXITCODE
      - name: Test packages
        id: test
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/PackageContentsTests/*" --report-trx --results-directory artifacts/test-results/package/product --minimum-expected-tests 1 --timeout 25m --hangdump --hangdump-timeout 15m --hangdump-type Mini
          exit $LASTEXITCODE
      - name: List package tests after failure
        if: ${{ failure() && !cancelled() && steps.build.outcome == 'success' && steps.test.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --project tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release --no-build --treenode-filter "/*/*/PackageContentsTests/*" --list-tests
          exit $LASTEXITCODE
      - name: Record processes after tests
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE
      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-process-snapshot-packages
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload package test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-package-test-results
          path: artifacts/test-results/package/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
      - name: Upload complete package feed
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: native-package-feed
          path: artifacts/feed/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}

  release-assets:
    name: Assemble release assets
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
      - name: Download completed native evidence
        uses: actions/download-artifact@v8
        with:
          pattern: native-complete-*
          path: artifacts/native-receipts
          merge-multiple: false
      - name: Build native tool entry
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Assemble release assets
        run: |
          $ErrorActionPreference = 'Stop'
          $version = dotnet msbuild src/OpenCode.Mcp/OpenCode.Mcp.csproj -p:Configuration=Release -nodeReuse:false -p:UseSharedCompilation=false -getProperty:Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build tools/native.cs -- assets --receipts artifacts/native-receipts --evidence artifacts/native-receipts --output artifacts/release-assets --version "$version"
          exit $LASTEXITCODE
      - name: Record processes after assembly
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --no-build tools/native.cs -- snapshot --output (Join-Path $env:RUNNER_TEMP 'process-snapshot')
          exit $LASTEXITCODE
      - name: Upload process snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-process-snapshot-release-assets
          path: ${{ runner.temp }}/process-snapshot/processes.txt
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload release assets
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: native-release-assets
          path: artifacts/release-assets/**
          retention-days: ${{ env.NATIVE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  installer-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify and run pinned ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/installer-shellcheck-XXXXXX")
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$work/shellcheck.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$work/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$work/shellcheck.tar.xz" -C "$work"
          "$work/shellcheck-v0.11.0/shellcheck" --version | grep -Fx 'version: 0.11.0'
          "$work/shellcheck-v0.11.0/shellcheck" --shell=sh packaging/install/install.sh
      - name: Verify and run pinned PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP ('installer-analyzer-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $work | Out-Null
          $archive = Join-Path $work 'analyzer.zip'
          Invoke-WebRequest https://github.com/PowerShell/PSScriptAnalyzer/releases/download/1.25.0/PSScriptAnalyzer.1.25.0.nupkg -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -cne '14E634C828EB98EFB9F40B2918BA90F139ED5ECCDF663A2A747736D996995D60') { throw 'PSScriptAnalyzer archive hash differs.' }
          Expand-Archive $archive (Join-Path $work 'module')
          $manifest = @(Get-ChildItem (Join-Path $work 'module') -Recurse -Filter PSScriptAnalyzer.psd1)
          if ($manifest.Count -ne 1) { throw 'Expected exactly one analyzer manifest.' }
          $module = Import-Module $manifest[0].FullName -PassThru
          if ($module.Version.ToString() -cne '1.25.0') { throw 'PSScriptAnalyzer version differs.' }
          $findings = @(Invoke-ScriptAnalyzer -Path packaging/install/install.ps1)
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings.Count -ne 0) { throw 'Installer analyzer findings are not empty.' }

  installer:
    name: Install (${{ matrix.rid }})
    needs: [prepare, release-assets]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.consumer-matrix) }}
    env:
      INSTALLER_RID: ${{ matrix.rid }}
    steps:
      - name: Initialize owned SDK environment
        run: |
          $ErrorActionPreference = 'Stop'
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'dotnet')" >> $env:GITHUB_ENV
          "ASPIRE_HOME=$(Join-Path $env:RUNNER_TEMP 'aspire-home')" >> $env:GITHUB_ENV
          "INSTALLER_ASSETS=$(Join-Path $env:RUNNER_TEMP 'installer-assets')" >> $env:GITHUB_ENV
          if ($IsWindows) {
            "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
            "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          }
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk-version }}
          architecture: ${{ endsWith(matrix.rid, '-arm64') && 'arm64' || 'x64' }}
      - name: Download same-run release assets
        uses: actions/download-artifact@v8
        with:
          name: native-release-assets
          path: ${{ env.INSTALLER_ASSETS }}
      - name: Build native tool entry
        run: |
          dotnet build tools/native.cs
          exit $LASTEXITCODE
      - name: Build product test runner
        id: build
        run: |
          dotnet build tests/OpenCode.Mcp.Tests/OpenCode.Mcp.Tests.csproj -c Release -nodeReuse:false -p:UseSharedCompilation=false
          exit $LASTEXITCODE
      - name: Installer lifecycle cases and installed ExecutableTests (PowerShell 7)
        id: test
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          $cases = {
            $ErrorActionPreference = 'Stop'
            $windows = $env:OS -eq 'Windows_NT'
            $runtime = (Get-Process -Id $PID).Path
            $assets = $env:INSTALLER_ASSETS
            $rid = $env:INSTALLER_RID
            $scriptName = if ($windows) { 'install.ps1' } else { 'install.sh' }
            $installer = Join-Path $assets $scriptName
            $text = [IO.File]::ReadAllText($installer)
            $projection = if ($windows) { '(?m)^\$OpenCodeMcpReleaseVersion = ''([^'']+)''$' } else { '(?m)^OPENCODE_MCP_RELEASE_VERSION=''([^'']+)''$' }
            $version = [regex]::Match($text, $projection).Groups[1].Value
            if (-not $version) { throw 'Missing default version projection.' }
            $root = Join-Path $env:RUNNER_TEMP ('installer-' + [guid]::NewGuid().ToString('N'))
            $bin = Join-Path $root "command's directory"
            $data = Join-Path $root "payload's directory"
            $private = if ($windows) { Join-Path $bin '.opencode-mcp' } else { $data }
            $command = if ($windows) { Join-Path $bin 'current/opencode-mcp.exe' } else { Join-Path $bin 'opencode-mcp' }
            $suffix = if ($windows) { '.zip' } else { '.tar.gz' }
            $archiveName = "opencode-mcp-$version-$rid$suffix"
            $expected = Join-Path $root 'expected'
            $alternate = "$version+installer"
            $fixture = Join-Path $root 'fixture'
            $alternatePayload = Join-Path $root 'alternate'
            $bad = Join-Path $root 'bad'
            $snapshots = @{}
            $originalPath = $env:PATH
            $originalShell = $env:SHELL
            $originalZdot = $env:ZDOTDIR
            $originalConfig = $env:XDG_CONFIG_HOME
            $userKey = if ($windows) { [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true) }
            $rawPath = if ($windows) { $userKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) }
            $rawKind = if ($windows -and $null -ne $rawPath) { $userKey.GetValueKind('Path') }
            function Assert-Equal($Actual, $Expected, $Because) {
              $a = @($Actual); $e = @($Expected)
              $different = $a.Count -ne $e.Count
              if (-not $different) { for ($i = 0; $i -lt $a.Count; $i++) { if ($a[$i] -cne $e[$i]) { $different = $true; break } } }
              if ($different) {
                throw "$Because`nExpected: $($e -join '|')`nActual: $($a -join '|')"
              }
            }
            function Invoke-Case($Name, [scriptblock]$Body) { Write-Host "CASE $Name ($rid, $($PSVersionTable.PSVersion))"; & $Body }
            function Get-Inventory($Directory) {
              @(Get-ChildItem -LiteralPath $Directory -Recurse -File -Force | ForEach-Object {
                $_.FullName.Substring($Directory.Length + 1).Replace('\', '/') + ' ' + (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              } | Sort-Object -CaseSensitive)
            }
            function Invoke-Installer($Options, $Source = $assets, $Install = $bin, $DataDirectory = $data, $InputText = $null) {
              $arguments = @()
              if ($windows) {
                $entry = $installer
                if ($null -ne $InputText) { $entry = Join-Path $root 'invocation.ps1'; [IO.File]::WriteAllText($entry, $InputText) }
                $arguments += @('-NoProfile', '-File', $entry)
              }
              elseif ($null -ne $InputText) { $arguments += @('-s', '--') }
              else { $arguments += $installer }
              $arguments += $(if ($windows) { @('-InstallDir', $Install) } else { @('--install-dir', $Install, '--data-dir', $DataDirectory) })
              if ($Options -notcontains '--uninstall' -and $Options -notcontains '-Uninstall') {
                $arguments += $(if ($windows) { @('-AssetDir', $Source) } else { @('--asset-dir', $Source) })
              }
              $arguments += $Options
              $start = New-Object Diagnostics.ProcessStartInfo
              $start.FileName = if ($windows) { $runtime } else { 'sh' }
              $start.UseShellExecute = $false
              $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
              $start.RedirectStandardInput = $true
              $start.Arguments = ($arguments | ForEach-Object { '"' + ([regex]::Replace([string]$_, '(\\*)"', '$1$1\"') -replace '(\\+)$', '$1$1') + '"' }) -join ' '
              $process = New-Object Diagnostics.Process
              $process.StartInfo = $start
              try {
                if (-not $process.Start()) { throw 'Installer did not start.' }
                $stdout = $process.StandardOutput.ReadToEndAsync(); $stderr = $process.StandardError.ReadToEndAsync()
                if (-not $windows -and $null -ne $InputText) { $process.StandardInput.Write($InputText) }
                $process.StandardInput.Close()
                $process.WaitForExit()
                $out = $stdout.GetAwaiter().GetResult(); $err = $stderr.GetAwaiter().GetResult()
                @{ Code = $process.ExitCode; Stdout = $out; Stderr = $err; Lines = @(($out + $err) -split '\r?\n' | Where-Object { $_ -ne '' }) }
              } finally { $process.Dispose() }
            }
            function Assert-Result($Result, $Code, $Lines) {
              Assert-Equal $Result.Code $Code 'Installer exit code'
              Assert-Equal $Result.Lines $Lines 'Complete ordered installer output'
            }
            function Start-HeldCommand {
              $start = New-Object Diagnostics.ProcessStartInfo
              $start.FileName = $command; $start.UseShellExecute = $false
              $start.RedirectStandardInput = $true; $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
              $child = New-Object Diagnostics.Process; $child.StartInfo = $start
              try {
                if (-not $child.Start()) { throw 'Native child did not start.' }
                $child | Add-Member -NotePropertyName OutputDrain -NotePropertyValue $child.StandardOutput.ReadToEndAsync()
                $child | Add-Member -NotePropertyName ErrorDrain -NotePropertyValue $child.StandardError.ReadToEndAsync()
                Assert-Equal $child.HasExited $false 'Installed native child is running with stdin open'
                return $child
              } catch { Stop-HeldCommand $child; throw }
            }
            function Stop-HeldCommand($Child) {
              if ($null -eq $Child) { return }
              try {
                if (-not $Child.HasExited) { $Child.Kill() }
                $Child.WaitForExit()
                if ($Child.OutputDrain) { [void]$Child.OutputDrain.GetAwaiter().GetResult() }
                if ($Child.ErrorDrain) { [void]$Child.ErrorDrain.GetAwaiter().GetResult() }
              } finally { $Child.Dispose() }
            }
            function Get-Payload {
              if ($windows) { Join-Path $bin 'current' }
              else { Join-Path $data "versions/$version-$rid" }
            }
            function Assert-Installed($SelectedVersion = $version, $Payload = $expected) {
              $selected = if ($windows) { Join-Path $bin 'current' } else { Join-Path $data "versions/$SelectedVersion-$rid" }
              Assert-Equal (Test-Path -LiteralPath $command -PathType Leaf) $true 'Selected native command exists'
              Assert-Equal (Test-Path -LiteralPath $selected -PathType Container) $true 'Complete payload directory exists'
              Assert-Equal (Get-Inventory $selected) (Get-Inventory $Payload) 'Complete installed payload bytes'
              foreach ($record in @('owner', 'current', 'inventory')) {
                Assert-Equal (Test-Path -LiteralPath (Join-Path $private $record) -PathType Leaf) $true "Ownership record $record exists"
                Assert-Equal (Get-Item -LiteralPath (Join-Path $private $record)).Name $record 'Named ownership record exists'
              }
              Assert-Equal ([IO.File]::ReadAllLines((Join-Path $private 'current'))) @($SelectedVersion, $rid) 'Exact selected version/RID'
              if (-not $windows) {
                Assert-Equal (Get-Item -LiteralPath $command).Target (Join-Path $selected 'opencode-mcp') 'Selected command link'
                Assert-Equal (Get-Item -LiteralPath (Join-Path $selected 'opencode-mcp')).UnixFileMode (Get-Item -LiteralPath (Join-Path $Payload 'opencode-mcp')).UnixFileMode 'Native executable mode is preserved'
              }
            }
            $uninstall = if ($windows) { @('-Uninstall') } else { @('--uninstall') }
            $addPath = if ($windows) { @('-AddToPath') } else { @('--add-to-path') }
            $explicit = if ($windows) { @('-Version', $version) } else { @('--version', $version) }
            $upgrade = if ($windows) { @('-Version', $alternate) } else { @('--version', $alternate) }
            $installedMessage = "opencode-mcp: Installed $version ($rid): $command"
            function Save-Startup($Path) {
              if (-not $snapshots.ContainsKey($Path)) {
                $snapshots[$Path] = if (Test-Path -LiteralPath $Path) { [IO.File]::ReadAllBytes($Path) } else { $null }
              }
            }
            function Get-RawPath {
              if ($windows) { $userKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) }
              else { [Convert]::ToBase64String([IO.File]::ReadAllBytes($startup)) }
            }
            function Restore-RawPath {
              if ($null -eq $rawPath) { $userKey.DeleteValue('Path', $false) } else { $userKey.SetValue('Path', $rawPath, $rawKind) }
            }
            $failure = $null; $cleanupErrors = @()
            try {
              New-Item -ItemType Directory $root, $expected, $fixture | Out-Null
              [IO.File]::WriteAllText((Join-Path $root 'neighbor'), 'neighbor unchanged')
              [IO.File]::WriteAllText((Join-Path $root 'configuration'), 'configuration unchanged')
              if ($windows) { Expand-Archive -LiteralPath (Join-Path $assets $archiveName) -DestinationPath $expected }
              else {
                & tar -xzf (Join-Path $assets $archiveName) -C $expected
                if ($LASTEXITCODE -ne 0) { throw 'Candidate extraction failed.' }
                $env:SHELL = '/bin/sh'; $startup = Join-Path $HOME '.profile'; Save-Startup $startup
                if (-not (Test-Path -LiteralPath $startup)) { [IO.File]::WriteAllText($startup, '') }
              }
              $before = Get-RawPath
              Invoke-Case Install_Default_Version {
                Assert-Result (Invoke-Installer @()) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
                Assert-Installed
              }
              Invoke-Case Install_Without_Path_Consent {
                $withoutConsentBefore = Get-RawPath
                Assert-Result (Invoke-Installer @()) 0 @("opencode-mcp: Already installed $version ($rid): $command", 'opencode-mcp: PATH unchanged.')
                Assert-Equal (Get-RawPath) $withoutConsentBefore 'Repeat invocation leaves raw PATH bytes unchanged'
                Assert-Equal (Get-RawPath) $before 'No persistent PATH change without consent'
                Assert-Equal $env:PATH $originalPath 'Caller process PATH is unchanged'
                if ($windows -and $null -ne $rawPath) { Assert-Equal ($userKey.GetValueKind('Path')) $rawKind 'Raw PATH registry kind is unchanged' }
              }
              Invoke-Case Install_Explicit_Version {
                $alternateArchive = Join-Path $fixture "opencode-mcp-$alternate-$rid$suffix"
                Copy-Item -LiteralPath (Join-Path $assets $archiveName) -Destination $alternateArchive
                $hash = (Get-FileHash $alternateArchive -Algorithm SHA256).Hash.ToLowerInvariant()
                [IO.File]::WriteAllText((Join-Path $fixture 'SHA256SUMS'), "$hash  opencode-mcp-$alternate-$rid$suffix`n")
                Assert-Equal (Get-Item $alternateArchive).Name "opencode-mcp-$alternate-$rid$suffix" 'Explicit-version fixture asset basename'
                Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                Assert-Result (Invoke-Installer $upgrade $fixture) 0 @("opencode-mcp: Installed $alternate ($rid): $command", 'opencode-mcp: PATH unchanged.')
                Assert-Installed $alternate
                Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                Assert-Result (Invoke-Installer $explicit) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
                Assert-Installed
              }
              Invoke-Case Install_Is_Idempotent {
                Assert-Result (Invoke-Installer @()) 0 @("opencode-mcp: Already installed $version ($rid): $command", 'opencode-mcp: PATH unchanged.')
                Assert-Installed
                if ($windows) {
                  $ownerFile = Join-Path $private 'owner'; $ownerBytes = [IO.File]::ReadAllBytes($ownerFile)
                  try {
                    $ownerLines = [IO.File]::ReadAllLines($ownerFile); $ownerLines[1] = $ownerLines[1].ToUpperInvariant()
                    [IO.File]::WriteAllLines($ownerFile, $ownerLines, (New-Object Text.UTF8Encoding $false))
                    Assert-Result (Invoke-Installer @()) 0 @("opencode-mcp: Already installed $version ($rid): $command", 'opencode-mcp: PATH unchanged.')
                    Assert-Installed
                  } finally { [IO.File]::WriteAllBytes($ownerFile, $ownerBytes) }
                }
              }
              Invoke-Case Upgrade_Selects_Complete_New_Payload {
                Copy-Item -LiteralPath (Join-Path $assets $archiveName) -Destination (Join-Path $fixture "opencode-mcp-$alternate-$rid$suffix")
                $alternatePayload = Join-Path $root 'alternate'; New-Item -ItemType Directory $alternatePayload | Out-Null
                Copy-Item "$expected/*" $alternatePayload -Recurse -Force
                [IO.File]::AppendAllText((Join-Path $alternatePayload 'LICENSE'), "`ninstaller alternate fixture`n")
                $alternateArchive = Join-Path $fixture "opencode-mcp-$alternate-$rid$suffix"
                Remove-Item -LiteralPath $alternateArchive
                if ($windows) { Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::CreateFromDirectory($alternatePayload, $alternateArchive) }
                else { & tar -czf $alternateArchive -C $alternatePayload .; if ($LASTEXITCODE -ne 0) { throw 'Fixture pack failed.' } }
                $hash = (Get-FileHash $alternateArchive -Algorithm SHA256).Hash.ToLowerInvariant()
                [IO.File]::WriteAllText((Join-Path $fixture 'SHA256SUMS'), "$hash  opencode-mcp-$alternate-$rid$suffix`n")
                Assert-Result (Invoke-Installer $upgrade $fixture) 0 @("opencode-mcp: Installed $alternate ($rid): $command", 'opencode-mcp: PATH unchanged.')
                Assert-Installed $alternate $alternatePayload
                if ($windows) { Assert-Equal @(Get-ChildItem $private -Filter 'previous-*' | ForEach-Object Name) @() 'No previous payload remains' }
                else { Assert-Equal (Test-Path (Join-Path $data "versions/$version-$rid")) $false 'Old owned version removed' }
                Assert-Result (Invoke-Installer $explicit) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
              }
              Invoke-Case Upgrade_Preserves_Previous_On_Failure {
                $selection = [IO.File]::ReadAllBytes((Join-Path $private 'current'))
                $recordsBefore = @{}
                foreach ($name in @('owner','current','inventory')) { $recordsBefore[$name] = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $private $name))) }
                $pathBefore = Get-RawPath
                $handle = $null
                $heldCommand = $null
                try {
                  if ($windows) { $heldCommand = Start-HeldCommand }
                  else { & chmod a-w $bin; if ($LASTEXITCODE -ne 0) { throw 'Activation obstruction failed.' } }
                  Assert-Result (Invoke-Installer $upgrade $fixture) 1 @('opencode-mcp: Installation failed during activation.')
                  if ($windows) { Assert-Equal $heldCommand.HasExited $false 'Upgrade never stops the held native child' }
                  Assert-Installed
                  Assert-Equal ([Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $private 'current')))) ([Convert]::ToBase64String($selection)) 'Selection preserved'
                  foreach ($name in @('owner','current','inventory')) { Assert-Equal ([Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $private $name)))) $recordsBefore[$name] "Upgrade failure preserves $name bytes" }
                  Assert-Equal (Get-RawPath) $pathBefore 'PATH preserved after activation failure'
                } finally {
                  Stop-HeldCommand $heldCommand
                  if ($handle) { $handle.Dispose() }
                  if (-not $windows) { & chmod u+w $bin; if ($LASTEXITCODE -ne 0) { throw 'Obstruction cleanup failed.' } }
                }
                if ($windows) {
                  try {
                    $handle = [IO.File]::Open((Join-Path $private 'inventory'), 'Open', 'Read', 'Read')
                    Assert-Result (Invoke-Installer $upgrade $fixture) 1 @('opencode-mcp: Installation failed during activation.', "opencode-mcp: Cleanup failed; retained owned directory: $private.")
                    Assert-Installed
                    foreach ($name in @('owner','current','inventory')) { Assert-Equal ([Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $private $name)))) $recordsBefore[$name] "Post-activation rollback preserves $name bytes" }
                    Assert-Equal (Get-RawPath) $pathBefore 'Post-activation rollback preserves PATH'
                  } finally {
                    if ($handle) { $handle.Dispose() }
                    Get-ChildItem -LiteralPath $private -Filter 'temporary-*' -Directory | Remove-Item -Recurse
                  }
                  $faultLine = (Select-String -LiteralPath $installer -Pattern '^    Invoke-InstallerPathAddition$').LineNumber
                  $rollbackObservation = @"
          `$script:locks = @()
          `$breakpoint = Set-PSBreakpoint -Script '$($installer.Replace("'", "''"))' -Line $faultLine -Action {
            `$script:locks += [IO.File]::Open('$($command.Replace("'", "''"))', 'Open', 'Read', 'Read')
            `$record = Join-Path `$state.Work 'path.record'
            [IO.File]::WriteAllText(`$record, '')
            `$script:locks += [IO.File]::Open(`$record, 'Open', 'Read', 'None')
          }
          try { & '$($installer.Replace("'", "''"))' @args; `$code = `$LASTEXITCODE }
          finally { Remove-PSBreakpoint `$breakpoint; foreach (`$lock in `$script:locks) { `$lock.Dispose() } }
          exit `$code
          "@
                  try {
                    Assert-Result (Invoke-Installer $upgrade $fixture $bin $data $rollbackObservation) 1 @('opencode-mcp: Installation failed during path.', "opencode-mcp: Cleanup failed; retained owned directory: $private.")
                    Assert-Installed $alternate $alternatePayload
                    Assert-Equal (Get-RawPath) $pathBefore 'Failed payload rollback keeps PATH unchanged'
                    Assert-Equal @(Get-ChildItem -LiteralPath $private -Filter 'previous-*' -Directory | ForEach-Object { Get-Inventory $_.FullName }) (Get-Inventory $expected) 'Failed payload rollback retains the complete old payload'
                  } finally {
                    Get-ChildItem -LiteralPath $private -Directory | Where-Object { $_.Name -like 'temporary-*' -or $_.Name -like 'previous-*' } | Remove-Item -Recurse
                  }
                  Assert-Result (Invoke-Installer $explicit) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
                  Assert-Installed
                }
                if (-not $windows) {
                  $signalCommands = Join-Path $root 'signal-observation'; New-Item -ItemType Directory $signalCommands | Out-Null
                  $realMove = (Get-Command mv -CommandType Application).Source
                  $moveFixture = Join-Path $signalCommands 'mv'; $linkPrefix = ($bin + '/.opencode-mcp-').Replace("'", "'\''")
                  try {
                    $env:PATH = $signalCommands + ':' + $originalPath
                    foreach ($point in @('*/payload', "'$linkPrefix'*")) {
                      foreach ($signal in @(@('HUP',129), @('INT',130), @('TERM',143))) {
                        foreach ($timing in @('before','after')) {
                          $moveAction = "'$realMove' `"`$@`" || exit 1`n"
                          $signalAction = "case `"`$1`" in $point) kill -$($signal[0]) `"`$PPID`"; exit 0;; esac`ncase `"`$2`" in $point) kill -$($signal[0]) `"`$PPID`"; exit 0;; esac`n"
                          $fixtureBody = if ($timing -eq 'before') { $signalAction + $moveAction } else { $moveAction + $signalAction }
                          [IO.File]::WriteAllText($moveFixture, "#!/bin/sh`n$fixtureBody")
                          & chmod +x $moveFixture; if ($LASTEXITCODE -ne 0) { throw 'Signal fixture chmod failed.' }
                          Assert-Result (Invoke-Installer $upgrade $fixture) $signal[1] @()
                          Assert-Installed
                          foreach ($name in @('owner','current','inventory')) { Assert-Equal ([Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $private $name)))) $recordsBefore[$name] "Signal cleanup restores $name bytes" }
                          Assert-Equal (Get-RawPath) $pathBefore 'Signal cleanup preserves PATH bytes'
                        }
                      }
                    }
                  } finally { $env:PATH = $originalPath }
                }
              }
              Invoke-Case Uninstall_Refuses_Changed_Owned_State {
                $license = Join-Path (Get-Payload) 'LICENSE'; $original = [IO.File]::ReadAllBytes($license)
                try {
                  [IO.File]::WriteAllText($license, 'changed owned payload')
                  Assert-Result (Invoke-Installer $uninstall) 2 @('opencode-mcp: Installed files differ from the ownership record: LICENSE.')
                  Assert-Equal ([IO.File]::ReadAllText($license)) 'changed owned payload' 'Altered bytes preserved'
                } finally { [IO.File]::WriteAllBytes($license, $original) }
                if (-not $windows) {
                  $target = (Get-Item -LiteralPath $command).Target
                  Remove-Item -LiteralPath $command; New-Item -ItemType SymbolicLink -Path $command -Target (Join-Path $root 'neighbor') | Out-Null
                  try { Assert-Result (Invoke-Installer $uninstall) 2 @('opencode-mcp: Installed files differ from the ownership record: opencode-mcp.') }
                  finally { Remove-Item -LiteralPath $command; New-Item -ItemType SymbolicLink -Path $command -Target $target | Out-Null }
                  $other = Join-Path $root 'different'
                  Assert-Result (Invoke-Installer $uninstall $assets $other) 2 @("opencode-mcp: Installation directory differs from the ownership record: $other.")
                  Assert-Installed
                  Assert-Equal (Test-Path -LiteralPath $other) $false 'Mismatched uninstall directory is not created'
                }
                $unexpected = Join-Path (Get-Payload) 'unexpected-directory'
                New-Item -ItemType Directory $unexpected | Out-Null
                try {
                  Assert-Result (Invoke-Installer $uninstall) 2 @('opencode-mcp: Installed files differ from the ownership record: unexpected-directory.')
                  Assert-Equal (Get-Item -LiteralPath $unexpected).Name 'unexpected-directory' 'Unexpected directory is preserved'
                } finally { Remove-Item -LiteralPath $unexpected }
              }
              Invoke-Case Uninstall_Preserves_Unrelated_State {
                New-Item -ItemType Directory $bin -Force | Out-Null
                [IO.File]::WriteAllText((Join-Path $bin 'unrelated'), 'unrelated unchanged')
                Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                Assert-Equal ([IO.File]::ReadAllText((Join-Path $bin 'unrelated'))) 'unrelated unchanged' 'Unrelated installation file preserved'
                Assert-Equal (Test-Path -LiteralPath $command) $false 'Owned command removed'
                Assert-Equal (Test-Path -LiteralPath $private) $false 'Owned private root removed'
                Assert-Equal @(Get-ChildItem -LiteralPath $bin -Force | ForEach-Object Name) @('unrelated') 'Only the named unrelated file remains, with no dangling command link'
                if ($windows) { Assert-Equal (Test-Path -LiteralPath (Join-Path $bin 'current')) $false 'Windows payload removed' }
                Remove-Item -LiteralPath (Join-Path $bin 'unrelated'); Remove-Item -LiteralPath $bin
                Assert-Equal ([IO.File]::ReadAllText((Join-Path $root 'configuration'))) 'configuration unchanged' 'Configuration preserved'
                Assert-Result (Invoke-Installer @()) 0 @($installedMessage, 'opencode-mcp: PATH unchanged.')
                $container = if ($windows) { $bin } else { $data }
                $userFile = Join-Path $container 'user-file'
                [IO.File]::WriteAllText($userFile, 'user bytes unchanged')
                if ($windows) {
                  $privateUserFile = Join-Path $private 'user-file'; [IO.File]::WriteAllText($privateUserFile, 'private user bytes unchanged')
                  $unchanged = Get-Inventory $bin; $pathBefore = Get-RawPath
                  try {
                    Assert-Result (Invoke-Installer $uninstall) 2 @('opencode-mcp: Installed files differ from the ownership record: .opencode-mcp/user-file.')
                    Assert-Equal (Get-Inventory $bin) $unchanged 'Private foreign file refusal changes no installation bytes'
                    Assert-Equal (Get-RawPath) $pathBefore 'Private foreign file refusal preserves PATH'
                    Assert-Equal ([IO.File]::ReadAllText($privateUserFile)) 'private user bytes unchanged' 'Private foreign bytes survive'
                  } finally { Remove-Item -LiteralPath $privateUserFile }
                }
                Assert-Result (Invoke-Installer $uninstall) 0 @("opencode-mcp: Uninstalled opencode-mcp: $bin")
                Assert-Equal ([IO.File]::ReadAllText($userFile)) 'user bytes unchanged' 'User file bytes survive uninstall'
                Assert-Equal (Test-Path -LiteralPath $container -PathType Container) $true 'Container with user file survives'
                Remove-Item -LiteralPath $userFile; Remove-Item -LiteralPath $container
              }
              Invoke-Case Install_Refuses_Foreign_Command {
                New-Item -ItemType Directory $bin | Out-Null
                $foreign = if ($windows) { Join-Path $bin 'current' } else { $command }
